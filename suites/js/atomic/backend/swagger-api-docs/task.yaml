id: backend-swagger-api-docs
title: "OpenAPI / Swagger Documentation Generator"
ecosystem: js
bases:
  - base-node
family: api
packages: ["swagger-ui-express"]
difficulty: medium
category: backend
language: javascript
tags: ["node-tasks", "ecosystem", "ecosystem-lib"]
timeoutSec: 300
promptFile: spec.md
readmeFile: README.md
grade:
  - build: true
  - package_deps:
      packages: ["swagger-ui-express"]
  - api_oracle:
      command: "MITII_NO_LISTEN=1 node --test test/oracle.test.js"
      timeoutMs: 120000
