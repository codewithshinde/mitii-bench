name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-and-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm fixtures:install
      - run: pnpm test
      - run: pnpm case:validate
      - name: Dry-run site-nav-pages matrix
        run: pnpm case:dry-run frontend-site-nav-pages
